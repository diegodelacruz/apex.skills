[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
	-v
	-ra
	--strict-markers
	--tb=short
	--cov=scripts
	--cov=skills
	--cov-report=term-missing
	--cov-report=html
	--cov-fail-under=20

markers =
	unit: Unit tests (fast, isolated)
	integration: Integration tests (may require Oracle connection)
	slow: Slow running tests
	requires_oracle: Tests that require Oracle APEX connection
	e2e: End-to-end tests
