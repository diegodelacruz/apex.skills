[pytest]
# PyTest Configuration for APEX Skills

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output with short summary
addopts =
    -v
    -ra
    --strict-markers
    --tb=short

# Register custom markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require Oracle connection)
    slow: Slow running tests
    requires_oracle: Tests that require Oracle APEX connection

# Coverage options (use with --cov)
# pytest --cov=scripts --cov=skills --cov-report=html
