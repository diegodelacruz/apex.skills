[pytest]
# PyTest Configuration for APEX Skills

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output with coverage tracking and mandatory threshold
addopts =
	-v
	-ra
	--strict-markers
	--tb=short
	--cov=scripts
	--cov=skills
	--cov-report=term-missing
	--cov-report=html
	--cov-fail-under=85

# Register custom markers
markers =
	unit: Unit tests (fast, isolated)
	integration: Integration tests (may require Oracle connection)
	slow: Slow running tests
	requires_oracle: Tests that require Oracle APEX connection
	e2e: End-to-end tests

# Coverage configuration
# Minimum threshold: 85% - CI/CD will fail if below this
