repos:
  # Secret detection - Scans for exposed credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
            \.mcp\.json\.example|
            upstreams\.lock\.json|
            tests/fixtures/
          )$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # Ensure files use tabs for indentation (not spaces)
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=120']

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']

  # Linting with flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--extend-ignore=E203,W503,E101,W191,E402', '--per-file-ignores=skills/apex-export-qa-safe/scripts/validate_export.py:F401']

  # Security linting with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', '.bandit.yaml']
        exclude: tests/

  # Canonical ecosystem policy and local link/resource audit
  - repo: local
    hooks:
      - id: ecosystem-audit
        name: Ecosystem audit
        entry: python scripts/audit_skill_ecosystem.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]

  # Validate exception handling (no bare except)
  - repo: local
    hooks:
      - id: validate-exception-handling
        name: Validate exception handling (no bare except)
        entry: python -c "import re,sys;bad=[f for f in sys.argv[1:] if re.search(r'except\s*:',open(f,encoding='utf-8').read())];sys.exit('Bare except found in '+', '.join(bad)) if bad else None"
        language: system
        types: [python]
        stages: [commit]
