[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | \.upstreams
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["apex_export_utilities"]
skip_gitignore = true
