interface:
  display_name: "Oracle and APEX Coordinator"
  short_description: "Route Oracle or APEX requests by the user's requested scope."
  default_prompt: "Describe your Oracle or APEX objective and environment. For Oracle schema objects, use DATA by default and qualify DDL/DML with that owner unless the user explicitly names another schema; follow specific governance exceptions such as backup objects. Never fall back to the connected user's schema after an owner error. The coordinator uses the credential configured for that environment; effective privileges granted by the DBA determine available operations. It verifies the connected account and target environment with read-only checks when available, uses configured routes without extra approval steps, and reports observed results."
