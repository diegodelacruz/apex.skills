interface:
  display_name: Oracle APEX Database Diagnostics
  short_description: Diagnose APEX and Oracle errors via secure MCP profiles.
  default_prompt: Diagnose this Oracle or APEX request in the user's named environment. Use that environment's profile from the repository-root .env through a repository-managed launcher and verify the connected account/target with read-only checks when available; do not substitute connector-specific or process-environment profiles. Effective DBA-granted privileges determine available operations. For APEX page metadata, a SQLcl user differing from the parsing schema is not a denial; verify the configured APEX MCP target, then query public APEX_APPLICATION_* views if the page helper is incompatible. Use configured routes and execute queries the agent can run; do not add approval steps or ask the user to run them.
