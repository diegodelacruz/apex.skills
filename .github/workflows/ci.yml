name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -v --cov=scripts --cov-report=xml --cov-report=term

      - name: Run black
        run: |
          python -m black --check scripts tests

      - name: Run isort
        run: |
          python -m isort --check-only scripts tests

      - name: Run flake8
        run: |
          python -m flake8 scripts tests --max-line-length=120

      - name: Run mypy
        run: |
          python -m mypy scripts tests

      - name: Run bandit
        run: |
          python -m bandit -c .bandit.yaml -r scripts tests

      - name: Run detect-secrets
        run: |
          detect-secrets scan --all-files --force-use-all-plugins

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
