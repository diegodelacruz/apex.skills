name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ecosystem audit
        run: python scripts/audit_skill_ecosystem.py
      - name: Run tests with coverage
        run: python -m pytest tests -v --cov=scripts --cov-report=xml --cov-report=term
      - name: Check formatting and imports
        run: |
          python -m black --check scripts tests
          python -m isort --check-only scripts tests
          python -m flake8 scripts tests --max-line-length=120
      - name: Check types and security
        run: |
          python -m mypy --ignore-missing-imports scripts tests
          python -m bandit -c .bandit.yaml -r scripts tests
      - name: Check secrets and patch whitespace
        run: |
          detect-secrets scan --all-files --force-use-all-plugins
          git diff --check
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
